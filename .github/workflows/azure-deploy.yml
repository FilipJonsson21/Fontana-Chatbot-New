name: Deploy till Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Tillåter manuell deploy från GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Bygg och publicera
        run: |
          dotnet restore
          dotnet publish Fontana.AI.WebAPI/Fontana.AI.WebAPI.csproj \
            --configuration Release \
            --output ./publish \
            --no-restore

      - name: Deploya till Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
