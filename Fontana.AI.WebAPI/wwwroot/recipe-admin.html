<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepthantering — Fontana Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #faf8f5;
            color: #2c2c2c;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            background: #072852;
            padding: 0 40px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header .logo span { color: #c8a96e; }
        header .badge {
            background: rgba(200,169,110,0.2);
            border: 1px solid #c8a96e;
            color: #c8a96e;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ── LAYOUT ── */
        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        h1 {
            font-size: 26px;
            color: #072852;
            font-weight: normal;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }
        #toast.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        #toast.error   { background: #fdecea; color: #c62828; border: 1px solid #ffcdd2; }

        /* ── STATS ── */
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 16px 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            min-width: 120px;
        }
        .stat-card .num { font-size: 28px; color: #072852; font-weight: bold; }
        .stat-card .lbl { font-size: 12px; color: #888; margin-top: 2px; }

        /* ── FILTER ── */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar input {
            flex: 1;
            min-width: 200px;
            border: 1px solid #e0dbd2;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 14px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .toolbar input:focus { border-color: #072852; }

        /* ── TABLE ── */
        .table-wrap {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.07);
            overflow: hidden;
            margin-bottom: 32px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #072852;
            color: white;
        }
        thead th {
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        tbody tr {
            border-bottom: 1px solid #f0ece5;
            transition: background 0.15s;
        }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #fdf9f4; }
        tbody tr.editing { background: #fffbf4; }
        td {
            padding: 14px 16px;
            font-size: 14px;
            vertical-align: top;
        }
        td.id-col { color: #aaa; font-size: 12px; width: 48px; }
        td.tag-col { width: 110px; }
        td.actions-col { width: 100px; text-align: right; white-space: nowrap; }

        .tag-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #eef2ff;
            color: #3730a3;
            margin: 2px 2px 0 0;
        }

        a.recipe-link { color: #072852; }

        /* Redigeringsfält i tabellen */
        td textarea, td input[type="text"] {
            width: 100%;
            border: 1px solid #c8a96e;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
            font-family: inherit;
            background: #fffef9;
            outline: none;
            resize: vertical;
            margin-bottom: 6px;
        }
        td textarea { min-height: 60px; }

        /* ── KNAPPAR ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.97); }
        .btn-primary   { background: #072852; color: white; }
        .btn-secondary { background: #f0ece5; color: #555; }
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.15s;
        }
        .btn-icon:hover { background: #f0ece5; }

        /* ── LÄGG TILL FORMULÄR ── */
        .add-form {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.07);
            padding: 28px;
        }
        .add-form h2 {
            font-size: 17px;
            color: #072852;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input,
        .form-group textarea {
            border: 1px solid #e0dbd2;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            background: #faf8f5;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus { border-color: #072852; background: white; }
        .form-group textarea { min-height: 70px; }
        .form-actions { margin-top: 20px; display: flex; gap: 10px; }

        #empty-state {
            text-align: center;
            padding: 48px;
            color: #aaa;
            font-size: 15px;
        }

        @media (max-width: 700px) {
            main { padding: 20px 12px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">F<span>o</span>ntana <span style="color:rgba(255,255,255,0.4);font-weight:normal;font-size:14px;margin-left:8px;">/ Admin</span></div>
    <nav style="display:flex;gap:0;">
        <a href="/faq-admin.html" style="color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;margin-right:24px;text-transform:uppercase;letter-spacing:0.5px;">FAQ</a>
        <a href="/recipe-admin.html" style="color:white;text-decoration:none;font-size:13px;margin-right:24px;text-transform:uppercase;letter-spacing:0.5px;">Recept</a>
        <a href="/wine-admin.html" style="color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;margin-right:24px;text-transform:uppercase;letter-spacing:0.5px;">Vin</a>
        <a href="/conversations.html" style="color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;">Historik</a>
    </nav>
    <div class="badge">Recepthantering</div>
    <button onclick="logout()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);color:white;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;margin-left:16px;">Logga ut</button>
</header>

<main>
    <h1>Recepthantering</h1>
    <p class="subtitle">Lägg till, redigera och ta bort recept som Frixos kan rekommendera och länka till.</p>

    <div class="stats">
        <div class="stat-card">
            <div class="num" id="stat-total">—</div>
            <div class="lbl">Totalt antal recept</div>
        </div>
        <div class="stat-card">
            <div class="num" id="stat-ingredients">—</div>
            <div class="lbl">Unika huvudingredienser</div>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" id="search" placeholder="Sök titel, ingrediens, måltid…" oninput="renderTable()">
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Recept</th>
                    <th>Taggar</th>
                    <th>Länk</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="recipe-tbody">
                <tr><td colspan="5" id="empty-state">Laddar…</td></tr>
            </tbody>
        </table>
    </div>

    <div class="add-form">
        <h2>+ Lägg till nytt recept</h2>
        <div class="form-grid">
            <div class="form-group full">
                <label>Titel</label>
                <input type="text" id="new-title" placeholder="t.ex. Grillad halloumi med tzatziki">
            </div>
            <div class="form-group">
                <label>Huvudingrediens</label>
                <input type="text" id="new-mainingredient" placeholder="t.ex. halloumi">
            </div>
            <div class="form-group">
                <label>Måltid</label>
                <input type="text" id="new-mealtype" placeholder="t.ex. middag, förrätt">
            </div>
            <div class="form-group">
                <label>Tillfälle</label>
                <input type="text" id="new-occasion" placeholder="t.ex. vardag, grillkväll">
            </div>
            <div class="form-group">
                <label>Recepttyp</label>
                <input type="text" id="new-recipetype" placeholder="t.ex. vegetariskt, snabbt">
            </div>
            <div class="form-group full">
                <label>Beskrivning</label>
                <textarea id="new-description" placeholder="Kort beskrivning av receptet…"></textarea>
            </div>
            <div class="form-group full">
                <label>Länk till receptet</label>
                <input type="text" id="new-url" placeholder="https://www.fontana.se/recept/...">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" onclick="createRecipe()">Spara recept</button>
            <button class="btn btn-secondary" onclick="clearForm()">Rensa</button>
        </div>
    </div>
</main>

<div id="toast"></div>

<script>
    let allRecipes = [];
    let editingId = null;

    // ── Datahämtning ──
    async function loadRecipes() {
        try {
            const res = await fetch('/api/recipe');
            if (!res.ok) throw new Error(res.status);
            allRecipes = await res.json();
            updateStats();
            renderTable();
        } catch {
            showToast('Kunde inte ladda receptlistan. Kontrollera att servern körs.', 'error');
            document.getElementById('recipe-tbody').innerHTML =
                '<tr><td colspan="5" id="empty-state">Kunde inte ladda data.</td></tr>';
        }
    }

    // ── Statistik ──
    function updateStats() {
        document.getElementById('stat-total').textContent = allRecipes.length;
        const ingredients = new Set(allRecipes.map(r => r.mainIngredient?.toLowerCase()).filter(Boolean));
        document.getElementById('stat-ingredients').textContent = ingredients.size;
    }

    // ── Rendera tabell ──
    function renderTable() {
        const search = document.getElementById('search').value.toLowerCase();

        const filtered = allRecipes.filter(r => !search ||
            r.title?.toLowerCase().includes(search) ||
            r.mainIngredient?.toLowerCase().includes(search) ||
            r.mealType?.toLowerCase().includes(search) ||
            r.occasion?.toLowerCase().includes(search) ||
            r.recipeType?.toLowerCase().includes(search));

        const tbody = document.getElementById('recipe-tbody');

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" id="empty-state">Inga recept hittades.</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(r => {
            if (r.id === editingId) return renderEditRow(r);
            return renderViewRow(r);
        }).join('');
    }

    function tagBadges(r) {
        return [r.mealType, r.occasion, r.recipeType]
            .filter(Boolean)
            .map(t => `<span class="tag-badge">${esc(t)}</span>`)
            .join('');
    }

    function renderViewRow(r) {
        return `
        <tr data-id="${r.id}">
            <td class="id-col">#${r.id}</td>
            <td>
                <div style="font-weight:500;margin-bottom:4px;">${esc(r.title)}</div>
                <div style="color:#888;font-size:12px;margin-bottom:4px;">Huvudingrediens: ${esc(r.mainIngredient)}</div>
                ${r.description ? `<div style="color:#666;font-size:13px;line-height:1.5;">${esc(r.description)}</div>` : ''}
            </td>
            <td class="tag-col">${tagBadges(r) || '<span style="color:#ccc">—</span>'}</td>
            <td style="max-width:200px;word-break:break-word;">
                <a class="recipe-link" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a>
            </td>
            <td class="actions-col">
                <button class="btn-icon" title="Redigera" onclick="startEdit(${r.id})">✏️</button>
                <button class="btn-icon" title="Ta bort" onclick="deleteRecipe(${r.id})">🗑️</button>
            </td>
        </tr>`;
    }

    function renderEditRow(r) {
        return `
        <tr class="editing" data-id="${r.id}">
            <td class="id-col">#${r.id}</td>
            <td>
                <input type="text" id="edit-title" value="${esc(r.title)}" placeholder="Titel">
                <input type="text" id="edit-mainingredient" value="${esc(r.mainIngredient)}" placeholder="Huvudingrediens">
                <textarea id="edit-description" placeholder="Beskrivning">${esc(r.description ?? '')}</textarea>
            </td>
            <td class="tag-col">
                <input type="text" id="edit-mealtype" value="${esc(r.mealType ?? '')}" placeholder="Måltid">
                <input type="text" id="edit-occasion" value="${esc(r.occasion ?? '')}" placeholder="Tillfälle">
                <input type="text" id="edit-recipetype" value="${esc(r.recipeType ?? '')}" placeholder="Recepttyp">
            </td>
            <td colspan="2">
                <input type="text" id="edit-url" value="${esc(r.url)}" placeholder="Länk">
                <div style="display:flex;gap:6px;margin-top:6px;">
                    <button class="btn-icon" title="Spara" onclick="saveEdit(${r.id})">💾</button>
                    <button class="btn-icon" title="Avbryt" onclick="cancelEdit()">✕</button>
                </div>
            </td>
        </tr>`;
    }

    // ── Redigering ──
    function startEdit(id) {
        editingId = id;
        renderTable();
        document.getElementById('edit-title')?.focus();
    }

    function cancelEdit() {
        editingId = null;
        renderTable();
    }

    function collectFormValues(prefix) {
        return {
            title: document.getElementById(`${prefix}-title`).value.trim(),
            mainIngredient: document.getElementById(`${prefix}-mainingredient`).value.trim(),
            mealType: document.getElementById(`${prefix}-mealtype`).value.trim() || null,
            occasion: document.getElementById(`${prefix}-occasion`).value.trim() || null,
            recipeType: document.getElementById(`${prefix}-recipetype`).value.trim() || null,
            description: document.getElementById(`${prefix}-description`).value.trim() || null,
            url: document.getElementById(`${prefix}-url`).value.trim()
        };
    }

    async function saveEdit(id) {
        const body = collectFormValues('edit');

        if (!body.title || !body.mainIngredient || !body.url) {
            showToast('Titel, huvudingrediens och länk är obligatoriska.', 'error');
            return;
        }

        try {
            const res = await fetch(`/api/recipe/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(res.status);
            const updated = await res.json();
            allRecipes = allRecipes.map(r => r.id === id ? updated : r);
            editingId = null;
            updateStats();
            renderTable();
            showToast('Recept uppdaterat!', 'success');
        } catch {
            showToast('Kunde inte spara ändringarna.', 'error');
        }
    }

    // ── Skapa ──
    async function createRecipe() {
        const body = collectFormValues('new');

        if (!body.title || !body.mainIngredient || !body.url) {
            showToast('Titel, huvudingrediens och länk är obligatoriska.', 'error');
            return;
        }

        try {
            const res = await fetch('/api/recipe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(res.status);
            const created = await res.json();
            allRecipes.push(created);
            clearForm();
            updateStats();
            renderTable();
            showToast('Nytt recept skapat!', 'success');
        } catch {
            showToast('Kunde inte skapa receptet.', 'error');
        }
    }

    function clearForm() {
        ['title', 'mainingredient', 'mealtype', 'occasion', 'recipetype', 'description', 'url']
            .forEach(f => document.getElementById(`new-${f}`).value = '');
    }

    // ── Ta bort ──
    async function deleteRecipe(id) {
        const recipe = allRecipes.find(r => r.id === id);
        if (!confirm(`Ta bort recept:\n"${recipe?.title}"\n\nDetta går inte att ångra.`)) return;

        try {
            const res = await fetch(`/api/recipe/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error(res.status);
            allRecipes = allRecipes.filter(r => r.id !== id);
            if (editingId === id) editingId = null;
            updateStats();
            renderTable();
            showToast('Recept borttaget.', 'success');
        } catch {
            showToast('Kunde inte ta bort receptet.', 'error');
        }
    }

    // ── Toast ──
    function showToast(message, type = 'success') {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.className = `show ${type}`;
        clearTimeout(el._timeout);
        el._timeout = setTimeout(() => el.className = '', 3000);
    }

    // ── XSS-skydd ──
    function esc(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    async function logout() {
        await fetch('/api/admin/logout', { method: 'POST' });
        window.location.href = '/admin-login.html';
    }

    loadRecipes();
</script>
</body>
</html>
